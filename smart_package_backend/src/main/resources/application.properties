spring.application.name=smart-package-backend
server.port=8080
# ==========================
# MQTT
# ==========================

app.mqtt.broker=${MQTT_BROKER_URL:tcp://localhost:1883}
app.mqtt.client-id=smart-package-backend
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.retry-interval-ms=${MQTT_RETRY_INTERVAL_MS:5000}

app.mqtt.topic.telemetry=smart-package/+/telemetry
app.mqtt.topic.event=smart-package/+/event
app.mqtt.topic.location=smart-package/+/location-scan


# ==========================
# DATABASE
# ==========================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_package}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.auth.username=${DASHBOARD_ADMIN_USERNAME:admin}
app.auth.password=${DASHBOARD_ADMIN_PASSWORD}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Let Tomcat see HTTPS before creating the session cookie behind Nginx/Cloudflare.
server.forward-headers-strategy=native
