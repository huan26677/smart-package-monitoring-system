services:

  emqx:

    build:
      context: ./emqx-docker

    container_name: smart-package-emqx

    restart: unless-stopped

    ports:
      - "1883:1883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"


  postgres:

    image: postgres:17-alpine

    container_name: smart-package-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - smart_package_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:

    build:
      context: ./smart_package_backend

    container_name: smart-package-backend

    restart: unless-stopped

    depends_on:

      postgres:
        condition: service_healthy

      emqx:
        condition: service_started

    environment:

      DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"

      DB_USERNAME: "${POSTGRES_USER}"

      DB_PASSWORD: "${POSTGRES_PASSWORD}"

      MQTT_BROKER_URL: "tcp://emqx:1883"

    ports:
      - "127.0.0.1:8080:8080"

  web:

    build:
      context: ./web-dashboard

    container_name: smart-package-web

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "127.0.0.1:8088:80"

  cloudflared:

    image: cloudflare/cloudflared:latest

    container_name: smart-package-cloudflared

    restart: unless-stopped

    depends_on:
      - web

    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

    command:
      - tunnel
      - --no-autoupdate
      - run

volumes:

  smart_package_postgres_data: