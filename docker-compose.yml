services:

  emqx:

    build:
      context: ./emqx-docker

    container_name: smart-package-emqx

    restart: unless-stopped

    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"


  postgres:

    image: postgres:17-alpine

    container_name: smart-package-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - smart_package_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:

  smart_package_postgres_data: