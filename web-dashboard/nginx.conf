# Preserve HTTPS from Cloudflare so session cookies receive the Secure flag.
map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
    http http;
}

server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # Docker can assign a new IP when the backend restarts or is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    location / {

        try_files
            $uri
            $uri/
            /index.html;
    }

    location /api/ {

        set $backend_url http://backend:8080;

        proxy_pass
            $backend_url;

        proxy_http_version
            1.1;

        proxy_set_header
            Host
            $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $origin_scheme;

        proxy_set_header X-Forwarded-Host $host;
    }
}
